name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Mesmo banco que o serviço postgres-test do docker-compose (.env.test)
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sellmanager
          POSTGRES_PASSWORD: sellmanager
          POSTGRES_DB: sellmanager_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U sellmanager -d sellmanager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # versão vem do campo packageManager do package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # inclui o openapi:check (antes de qualquer regeneração)
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      # O build regenera o openapi.json a partir do contrato: se mudou, o
      # arquivo commitado estava desatualizado.
      - name: openapi.json em dia com o contrato
        run: git diff --exit-code -- apps/api/openapi.json
      - run: pnpm test:unit
      - run: pnpm test:integration
