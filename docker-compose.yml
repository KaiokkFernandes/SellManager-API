services:
  postgres:
    image: postgres:18-alpine
    container_name: sellmanager-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-sellmanager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sellmanager}
      POSTGRES_DB: ${DB_NAME:-sellmanager}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Banco descartável para os testes de integração (dados em memória).
  postgres-test:
    image: postgres:18-alpine
    container_name: sellmanager-postgres-test
    environment:
      POSTGRES_USER: sellmanager
      POSTGRES_PASSWORD: sellmanager
      POSTGRES_DB: sellmanager_test
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sellmanager -d sellmanager_test']
      interval: 5s
      timeout: 5s
      retries: 10

  # Caixa de e-mail local para desenvolvimento (UI em http://localhost:8025)
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: sellmanager-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
